name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Finds the project no matter what the zip is called:
      # EmployeesApp.zip, EmployeesApp (1).zip ... (20).zip, "anything.zip", etc.
      # If several zips exist, the most recently uploaded one is built.
      # If there is no zip, an unzipped project in the repo is built.
      - name: Locate project (name-independent)
        id: proj
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # ---- 1) newest zip anywhere in the repo (by last commit time) ----
          best=""; best_t=-1
          while IFS= read -r -d '' z; do
            t=$(git log -1 --format=%ct -- "$z" 2>/dev/null || echo 0)
            t=${t:-0}
            if [ -z "$best" ] || [ "$t" -gt "$best_t" ] || { [ "$t" -eq "$best_t" ] && [[ "$z" > "$best" ]]; }; then
              best="$z"; best_t="$t"
            fi
          done < <(find . -path ./.git -prune -o -path ./_src -prune -o -type f -iname '*.zip' -print0)

          if [ -n "$best" ]; then
            echo "Using zip: $best"
            rm -rf _src && mkdir -p _src
            unzip -q -o "$best" -d _src
            ROOT=_src
          else
            echo "No zip found - looking for an unzipped project in the repo"
            ROOT=.
          fi

          # ---- 2) find the Gradle project root (shallowest settings.gradle[.kts] that has an app/ module) ----
          DIR=""
          while IFS= read -r s; do
            d=$(dirname "$s")
            if [ -d "$d/app" ]; then DIR="$d"; break; fi
          done < <(find "$ROOT" \( -path '*/.git' -o -path '*/build' -o -path '*/node_modules' -o -path '*/__MACOSX' \) -prune -o \
                    -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print \
                    | awk '{print gsub("/","/") " " $0}' | sort -n | cut -d' ' -f2-)

          if [ -z "$DIR" ]; then
            echo "ERROR: no Android project (settings.gradle + app/) found. Repo files:"
            find . -path ./.git -prune -o -type f -print | head -n 100
            exit 1
          fi
          echo "Project dir: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # versionCode = minutes since 1970, so every new build is higher than the
      # previous one and Android installs it as an update over the old app.
      - name: Compute version
        run: |
          echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --console=plain

      # Direct, un-zipped APK in the Releases page.
      - name: Publish APK to Releases (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find "${{ steps.proj.outputs.dir }}/app/build/outputs/apk" -name '*.apk' | head -n 1)
          [ -n "$APK" ] || { echo "APK not found"; exit 1; }
          cp "$APK" employees.apk
          TAG="build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" employees.apk \
            --repo "${{ github.repository }}" \
            --title "Employees APK #${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }}. Download employees.apk and install it (it updates the existing app)." \
            --latest

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ steps.proj.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
