name: Build Sanad Sport APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- 1) إيجاد المشروع تلقائياً (لا يهم اسم الملف المضغوط ولا عدد النسخ) ----------
      - name: Locate project (any zip name)
        run: |
          python3 - <<'PY'
          import os, subprocess, zipfile, shutil

          def has_project(d):
              return (os.path.isfile(os.path.join(d, "AndroidManifest.xml"))
                      and (os.path.isdir(os.path.join(d, "smali")) or os.path.isdir(os.path.join(d, "res"))))

          def find_project(root):
              for dp, dn, fn in os.walk(root):
                  if "__MACOSX" in dp:
                      continue
                  if has_project(dp):
                      return dp
              return None

          repo = os.getcwd()
          zips = []
          for dp, dn, fn in os.walk(repo):
              dn[:] = [d for d in dn if d not in (".git", "__MACOSX")]
              for f in fn:
                  if f.lower().endswith(".zip"):
                      p = os.path.join(dp, f)
                      try:
                          t = int(subprocess.run(["git", "log", "-1", "--format=%ct", "--", p],
                                  capture_output=True, text=True).stdout.strip() or 0)
                      except Exception:
                          t = 0
                      zips.append((t, os.path.getmtime(p), p))
          zips.sort(reverse=True)          # الأحدث أولاً

          found = None
          for i, (_, _, z) in enumerate(zips):
              out = f"/tmp/src_{i}"
              shutil.rmtree(out, ignore_errors=True)
              try:
                  with zipfile.ZipFile(z) as zf:
                      zf.extractall(out)
              except Exception as e:
                  print("skip", z, e)
                  continue
              d = find_project(out)
              if d:
                  print("Using zip:", z)
                  found = d
                  break

          if not found:                    # لو المشروع مرفوع كمجلد عادي
              found = find_project(repo)
              if found:
                  print("Using folder:", found)

          if not found:
              raise SystemExit("ERROR: no project with AndroidManifest.xml found")

          print("PROJECT_DIR =", found)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PROJECT_DIR={found}\n")
          PY

      # ---------- 2) تجهيز أدوات أندرويد (SDK تلقائي) ----------
      - name: Install Android build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "build-tools;35.0.0" >/dev/null 2>&1 || true
          BT="$ANDROID_HOME/build-tools/35.0.0"
          [ -x "$BT/apksigner" ] || BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "Using build-tools: $BT"

      - name: Download apktool
        run: |
          curl -fsSL -o /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          java -jar /tmp/apktool.jar --version

      # ---------- 3) تغيير الاسم إلى سند سبورت + إصلاح المشروع ----------
      - name: Rename app to Sanad Sport and prepare project
        run: |
          cd "$PROJECT_DIR"

          # اسم التطبيق في كل اللغات
          find res -type f -name 'strings.xml' -path '*values*' -print0 | while IFS= read -r -d '' f; do
            sed -i -E 's#(<string name="app_name"[^>]*>)[^<]*(</string>)#\1سند سبورت\2#' "$f"
            sed -i 's/ماجد/سند/g; s/Majed/Sanad/g' "$f"
          done
          grep -rn 'name="app_name"' res/values*/strings.xml | head

          # apktool.yml مفقود في المشروع -> نكتبه
          if [ ! -f apktool.yml ]; then
          cat > apktool.yml <<'YML'
          version: 2.11.1
          apkFileName: app.apk
          isFrameworkApk: false
          usesFramework:
            ids:
            - 1
          sdkInfo:
            minSdkVersion: '24'
            targetSdkVersion: '35'
          versionInfo:
            versionCode: '3'
            versionName: '1.2'
          doNotCompress:
          - arsc
          - so
          YML
          sed -i 's/^          //' apktool.yml
          fi
          cat apktool.yml

          # حذف أي توقيعات قديمة تسبب "الحزمة غير صالحة"
          find META-INF original/META-INF -maxdepth 1 -type f \
            \( -iname '*.RSA' -o -iname '*.DSA' -o -iname '*.EC' -o -iname '*.SF' -o -iname 'MANIFEST.MF' \) -delete 2>/dev/null || true

      # ---------- 4) البناء ----------
      - name: Build with apktool
        run: |
          java -jar /tmp/apktool.jar b "$PROJECT_DIR" -f -o /tmp/unsigned.apk

      # ---------- 5) محاذاة + توقيع (يمنع "الحزمة تبدو غير صالحة") ----------
      - name: Restore keystore cache
        id: ks
        uses: actions/cache@v4
        with:
          path: ~/sanad-keystore
          key: sanad-keystore-v1

      - name: Create keystore (first time only)
        if: steps.ks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/sanad-keystore
          keytool -genkeypair -keystore ~/sanad-keystore/sanad.jks \
            -alias sanad -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass sanad123456 -keypass sanad123456 \
            -dname "CN=Sanad Sport, O=Sanad, C=IQ"

      - name: Align and sign
        run: |
          "$BT/zipalign" -f -P 16 4 /tmp/unsigned.apk /tmp/aligned.apk \
            || "$BT/zipalign" -f -p 4 /tmp/unsigned.apk /tmp/aligned.apk

          "$BT/apksigner" sign \
            --ks ~/sanad-keystore/sanad.jks \
            --ks-pass pass:sanad123456 --key-pass pass:sanad123456 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out Sanad-Sport.apk /tmp/aligned.apk

          "$BT/apksigner" verify -v Sanad-Sport.apk | head -15
          "$BT/aapt2" dump badging Sanad-Sport.apk | grep -E "^package|application-label:" || true
          ls -lh Sanad-Sport.apk

      # ---------- 6) نشر APK مباشرة (بدون ZIP) ----------
      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Sanad-Sport.apk \
            --title "سند سبورت - build ${{ github.run_number }}" \
            --notes "حمّل ملف Sanad-Sport.apk مباشرة وثبّته." \
            --latest
